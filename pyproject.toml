[project]
name = "tender-bhai"
version = "1.0.0"
description = "Daily India government-tender agent for M.J. International"
requires-python = ">=3.12"
# Webhook runtime deps (Vercel reads this table when pyproject.toml exists). Keep in sync with requirements-vercel.txt.
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0",
    "neatlogs>=1.4",
]

[tool.vercel]
entrypoint = "api.webhook:app"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "B008", "SIM102", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["tender_bhai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
