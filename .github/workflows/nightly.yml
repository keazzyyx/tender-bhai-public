name: nightly

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST - scrape + extract
    - cron: "0 3 * * *"     # 08:30 IST - send digest
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: both
        options: [both, scrape, digest]
      dry_run:
        description: "Dry run (print instead of store/send)"
        type: boolean
        default: false
      portals:
        description: "Comma-separated scraper names (blank = all)"
        default: ""

concurrency:
  group: tender-bhai-nightly
  cancel-in-progress: false

jobs:
  scrape:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.job != 'digest' ||
      github.event_name == 'schedule' && github.event.schedule == '30 20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-5' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      NEATLOGS_API_KEY: ${{ secrets.NEATLOGS_API_KEY }}
      SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
      MIN_VALUE_INR: ${{ vars.MIN_VALUE_INR || '600000' }}
      MAX_PAGES_PER_PORTAL: ${{ vars.MAX_PAGES_PER_PORTAL || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - run: pip install -r requirements-worker.txt
      - run: python -m playwright install --with-deps chromium
      - name: Nightly scrape + extract
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.portals }}" ]; then ARGS="$ARGS --portals ${{ inputs.portals }}"; fi
          python scripts/nightly.py $ARGS

  digest:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.job != 'scrape' ||
      github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      NEATLOGS_API_KEY: ${{ secrets.NEATLOGS_API_KEY }}
      MESSAGING_PROVIDER: ${{ vars.MESSAGING_PROVIDER || 'whatsapp' }}
      RECIPIENT_PHONE: ${{ vars.RECIPIENT_PHONE || '91XXXXXXXXXX' }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vercel.txt
      - run: pip install -r requirements-vercel.txt
      - name: Send digest
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python scripts/send_digest.py $ARGS
